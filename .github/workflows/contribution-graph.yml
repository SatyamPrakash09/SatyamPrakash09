name: Generate Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution graph
        run: |
          mkdir -p dist
          curl -L \
            "https://gh.crafter.run/SatyamPrakash09?theme=dark&cols=150" \
            -o dist/contribution-graph.svg

      - name: Push generated graph to output branch
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
